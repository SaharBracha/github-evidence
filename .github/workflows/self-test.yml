# Dogfood test: runs this repo's action against a real JFrog environment,
# exactly the way a customer would — except it uses the local action (`./`)
# instead of the published `jfrog/git-evidence@v1`, so it tests the code on
# this branch/commit.
#
# To exercise it, open a pull request against this repo and merge it. The job
# is gated on the merge, just like the customer example, so a closed-unmerged
# PR produces nothing.
#
# Authentication uses OIDC (no stored access token): the runner exchanges its
# GitHub OIDC token for JFrog access via the named provider, which must be
# configured in the JFrog platform (Administration → OIDC).
#
# Configure once under Settings → Secrets and variables → Actions:
#   Secrets:   EVIDENCE_KEY
#   Variables: JF_URL, JF_PROJECT, JF_OIDC_PROVIDER, EVIDENCE_KEY_ALIAS
name: Self-test (git-evidence)

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  git-evidence:
    # GitHub has no "merged" trigger; listen on closed PRs and gate on merged.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          jf_url: ${{ vars.JF_URL }}
          jf_project: ${{ vars.JF_PROJECT }}
          oidc_provider_name: ${{ vars.JF_OIDC_PROVIDER }}
          evidence_signing_key: ${{ secrets.EVIDENCE_KEY }}
          evidence_key_alias: ${{ vars.EVIDENCE_KEY_ALIAS }}
