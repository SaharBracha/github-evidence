name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check JFrog CLA
        uses: jfrog/.github/actions/cla@8342bf108acbcb73a0f951cdea804385bf1d16fc # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
