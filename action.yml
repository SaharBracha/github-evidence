name: 'JFrog Traceability'
description: >-
  Collect Git evidence and attach it as signed JFrog evidence on the merge
  commit (a gitCommit entity keyed by the merge sha). On a merged pull
  request, records one github-pull-request evidence covering the merge's
  approvers, commits, and committers.
author: JFrog
branding:
  icon: shield
  color: green

inputs:
  jf_url:
    description: 'JFrog platform host (bare host or URL; normalized to https://<host>/).'
    required: true
  oidc_provider_name:
    description: >-
      Name of the OIDC integration configured in the JFrog platform. The runner
      exchanges its GitHub OIDC token for a JFrog access token via this provider,
      so no long-lived access token is stored. Requires `id-token: write`.
    required: true
  evidence_signing_key:
    description: 'Private key (raw PEM contents) used to sign the evidence.'
    required: true
  evidence_key_alias:
    description: >-
      Evidence signing key alias registered in the JFrog platform. Optional;
      defaults to `github-evidence`. Set only when the public key was
      registered under a different alias.
    required: false
  target_branch:
    description: >-
      Branch this action attests merges into. The preflight step skips events
      whose merge/push branch does not match this value. Optional; defaults to
      the repository's default branch (`github.event.repository.default_branch`).
      Set explicitly when your release trunk is a non-default branch (for
      example `release/main`) or to be tolerant of default-branch renames.
    required: false

runs:
  using: composite
  steps:
    # Ensure the action only runs when a merge onto the configured target
    # branch actually happened. Two independent checks:
    #   1) The trigger is a `push` event. Every other event (including
    #      merged `pull_request: closed` events) is rejected here so a
    #      single merge can never fan out to multiple runs when the caller
    #      workflow subscribes to overlapping triggers, and so the run is
    #      always attached to the merge commit on the target branch (rather
    #      than the PR head SHA on the source branch).
    #   2) The pushed branch matches TARGET_BRANCH.
    #      TARGET_BRANCH resolves to the `target_branch` input when set, and
    #      otherwise falls back to the repository default branch from the
    #      event payload — so consumers can override for release-trunk names
    #      like `release/main` without giving up the auto-detect default.
    # Everything else short-circuits with a notice before the JFrog CLI is
    # installed or OIDC is exchanged.
    - name: Preflight — validate push onto the target branch
      id: preflight
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PUSH_REF_NAME: ${{ github.ref_name }}
        TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "push" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping JFrog Traceability — this action only records evidence on push events to the target branch (event=${EVENT_NAME}, action=${EVENT_ACTION:-<none>})."
          exit 0
        fi
        event_branch="$PUSH_REF_NAME"

        TARGET_BRANCH="${TARGET_BRANCH_INPUT:-$DEFAULT_BRANCH}"
        if [[ -z "$TARGET_BRANCH" ]]; then
          echo "::warning::JFrog Traceability preflight could not determine the target branch: the 'target_branch' input is empty and the repository default branch is missing from the event payload. Proceeding without the target-branch check."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$event_branch" != "$TARGET_BRANCH" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping JFrog Traceability — event branch '${event_branch}' is not the configured target branch '${TARGET_BRANCH}'."
          exit 0
        fi

        echo "should_run=true" >> "$GITHUB_OUTPUT"

    - name: Normalize JFrog URL
      if: steps.preflight.outputs.should_run == 'true'
      shell: bash
      env:
        JF_URL_INPUT: ${{ inputs.jf_url }}
      run: |
        set -euo pipefail
        host="$JF_URL_INPUT"
        host="${host#http://}"
        host="${host#https://}"
        host="${host%/}"
        echo "JF_URL=https://${host}/" >> "$GITHUB_ENV"

    - name: Setup JFrog CLI
      if: steps.preflight.outputs.should_run == 'true'
      uses: jfrog/setup-jfrog-cli@v4.9.1
      env:
        JF_URL: ${{ env.JF_URL }}
      with:
        version: latest
        oidc-provider-name: ${{ inputs.oidc_provider_name }}

    - name: Generate git evidence
      if: steps.preflight.outputs.should_run == 'true'
      shell: bash
      env:
        AP: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COLLECTOR_VERSION: git-evidence
        EVIDENCE_SIGNING_KEY: ${{ inputs.evidence_signing_key }}
        EVIDENCE_KEY_ALIAS: ${{ inputs.evidence_key_alias }}
      run: |
        set -euo pipefail
        bash "$AP/scripts/generate-evidence.sh"
