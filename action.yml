name: 'JFrog Traceability'
description: >-
  Collect Git evidence and attach it as signed JFrog evidence on the merge
  commit (a gitCommit entity keyed by the merge sha). On a merged pull
  request, records one github-pull-request evidence covering the merge's
  approvers, commits, and committers.
author: JFrog
branding:
  icon: shield
  color: green

inputs:
  jf_url:
    description: 'JFrog platform host (bare host or URL; normalized to https://<host>/).'
    required: true
  oidc_provider_name:
    description: >-
      Name of the OIDC integration configured in the JFrog platform. The runner
      exchanges its GitHub OIDC token for a JFrog access token via this provider,
      so no long-lived access token is stored. Requires `id-token: write`.
    required: true
  evidence_signing_key:
    description: 'Private key (raw PEM contents) used to sign the evidence.'
    required: true
  evidence_key_alias:
    description: >-
      Evidence signing key alias registered in the JFrog platform. Optional;
      defaults to `github-evidence`. Set only when the public key was
      registered under a different alias.
    required: false

runs:
  using: composite
  steps:
    # Ensure the action only runs when a merge-onto-target-branch actually
    # happened. Two independent checks:
    #   1) The trigger is either a merged `pull_request: closed` event or a
    #      `push` (the caller filters branches via `on.push.branches`).
    #   2) The branch that was merged into / pushed to is the repository's
    #      default branch (`github.event.repository.default_branch`). This
    #      auto-detects the target branch from the repo settings — no extra
    #      input required — so PRs merging into feature/release branches, or
    #      pushes to non-default branches, are skipped with a notice.
    # Everything else short-circuits with a notice before the JFrog CLI is
    # installed or OIDC is exchanged.
    - name: Preflight — validate merge-onto-default-branch trigger
      id: preflight
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PUSH_REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        merged_pr=false
        event_branch=""
        if [[ "$EVENT_NAME" == "pull_request" \
           && "$EVENT_ACTION" == "closed" \
           && "$PR_MERGED" == "true" ]]; then
          merged_pr=true
          event_branch="$PR_BASE_REF"
        elif [[ "$EVENT_NAME" == "push" ]]; then
          event_branch="$PUSH_REF_NAME"
        fi

        if [[ "$merged_pr" != "true" && "$EVENT_NAME" != "push" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping JFrog Traceability — this action only records evidence on merged pull_request events or on push to the default branch (event=${EVENT_NAME}, action=${EVENT_ACTION:-<none>}, merged=${PR_MERGED:-<none>})."
          exit 0
        fi

        if [[ -z "$DEFAULT_BRANCH" ]]; then
          echo "::warning::JFrog Traceability preflight could not read the repository default branch from the event payload; proceeding without the target-branch check."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$event_branch" != "$DEFAULT_BRANCH" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping JFrog Traceability — event branch '${event_branch}' is not the repository default branch '${DEFAULT_BRANCH}'."
          exit 0
        fi

        echo "should_run=true" >> "$GITHUB_OUTPUT"

    - name: Normalize JFrog URL
      if: steps.preflight.outputs.should_run == 'true'
      shell: bash
      env:
        JF_URL_INPUT: ${{ inputs.jf_url }}
      run: |
        set -euo pipefail
        host="$JF_URL_INPUT"
        host="${host#http://}"
        host="${host#https://}"
        host="${host%/}"
        echo "JF_URL=https://${host}/" >> "$GITHUB_ENV"

    - name: Setup JFrog CLI
      if: steps.preflight.outputs.should_run == 'true'
      uses: jfrog/setup-jfrog-cli@v4.9.1
      env:
        JF_URL: ${{ env.JF_URL }}
      with:
        version: latest
        oidc-provider-name: ${{ inputs.oidc_provider_name }}

    - name: Generate git evidence
      if: steps.preflight.outputs.should_run == 'true'
      shell: bash
      env:
        AP: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COLLECTOR_VERSION: git-evidence
        EVIDENCE_SIGNING_KEY: ${{ inputs.evidence_signing_key }}
        EVIDENCE_KEY_ALIAS: ${{ inputs.evidence_key_alias }}
      run: |
        set -euo pipefail
        bash "$AP/scripts/generate-evidence.sh"
