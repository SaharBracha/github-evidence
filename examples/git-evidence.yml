# Example: create signed JFrog Traceability.
# Copy this file into your repository's .github/workflows/ directory.
#
# Runs only when a pull request is merged, and records both branch-protection
# and merged-PR evidence for that merge. To skip one, set its collect_* input
# to 'false' (see the commented line below).
name: JFrog Traceability

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  git-evidence:
    # GitHub has no "merged" trigger; listen on closed PRs and gate on merged.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jfrog/git-evidence@v1
        with:
          jf_url: ${{ vars.JF_URL }}
          jf_project: ${{ vars.JF_PROJECT }}
          oidc_provider_name: ${{ vars.JF_OIDC_PROVIDER }}
          evidence_signing_key: ${{ secrets.EVIDENCE_KEY }}
          evidence_key_alias: ${{ vars.EVIDENCE_KEY_ALIAS }}
