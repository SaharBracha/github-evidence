# Example: create signed JFrog Traceability.
# Copy this file into your repository's .github/workflows/ directory.
#
# Runs on two triggers:
#   * pull_request closed (merged into main) -> one github-pull-request evidence
#     for that merge
#   * branch_protection_rule created/edited/deleted -> one
#     branch-protection-rule evidence on the JFrog application identified by
#     the APP_KEY repo variable
name: JFrog Traceability

on:
  pull_request:
    types: [closed]
    branches: [main]
  branch_protection_rule:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  git-evidence:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'branch_protection_rule'
    runs-on: ubuntu-latest
    env:
      APP_KEY: ${{ vars.APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: jfrog/git-evidence@v1
        with:
          jf_url: ${{ vars.JF_URL }}
          oidc_provider_name: ${{ vars.JF_OIDC_PROVIDER }}
          evidence_signing_key: ${{ secrets.EVIDENCE_KEY }}
          evidence_key_alias: ${{ vars.EVIDENCE_KEY_ALIAS }}
